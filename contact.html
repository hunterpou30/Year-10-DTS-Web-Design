<div class="Main">
<form>

    <div class="form-row">
        <label for="fname" >First Name:</label>
        <input type="text" id="fname" placeholder="Brian" required>
    </div>

    <div class="form-row">
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" placeholder="Nguyen" required>
    </div>

    <div class="form-row">
        <label for="Bday">Date Of Birth:</label>
        <input type="date" id="Bday" required>
    </div>

    <div class="form-row">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Password123" required>
    </div>

    <div class="form-row">
        <label for="Fcolor">Favourite Color:</label>
        <input type="color" id="Fcolor">
    </div>

    <div class="form-row">
        <label>Gender:</label>
        <div>
            <label for="Male">Male</label>
            <input type="radio" id="Male" name="Gender">

            <label for="Female">Female</label>
            <input type="radio" id="Female" name="Gender">
        </div>
    </div>

    <div class="form-row">
        <label for="Photo">Image of self:</label>
        <input type="file" id="Photo" required>
    </div>

    <div class="form-row">
        <label for="Favourite Website">Favourite Website:</label>
        <input type="url" id="Favourite Website" placeholder="https://www.youtube.com/" required>
    </div>

    <div class="form-row">
        <label>Remember me:</label>
        <input type="checkbox">
    </div>

    <button type="submit">Submit</button>

</form>
